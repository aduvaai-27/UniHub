plugins { id 'com.android.application' }

// Firebase plugin is applied only when you add google-services.json (see README)
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.unihub.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.unihub.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { viewBinding true }          // View Binding (Week 8)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.android.volley:volley:1.2.1'          // Volley: HTTP / REST (GET) with RequestQueue
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'      // Realtime Database: live group chat
}
